services:
  - type: web
    name: assignment-question-check
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SHEETS_WEB_APP_URL
        sync: false
      - key: SHEETS_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_ID
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_CHANNEL_HANDLE
        value: "@종선이-m1y"
